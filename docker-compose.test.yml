services:
  db:
    image: postgres:15
    container_name: devops-tracker-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_tracker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build:
      context: ./backend
      dockerfile: tests/Dockerfile
    container_name: devops-tracker-backend-test
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/devops_tracker